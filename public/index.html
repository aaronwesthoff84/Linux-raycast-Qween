<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinuxCast</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    #root {
      width: 100vw;
      height: 100vh;
    }

    .container {
      background: rgba(30, 30, 30, 0.95);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .search-input {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: none;
      border-radius: 8px;
      background: rgba(50, 50, 50, 0.8);
      color: #fff;
      outline: none;
      margin-bottom: 16px;
    }

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .results-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      color: #fff;
    }

    .result-item:hover,
    .result-item.selected {
      background: rgba(0, 122, 255, 0.3);
    }

    .result-icon {
      width: 32px;
      height: 32px;
      margin-right: 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .result-name {
      font-size: 16px;
      font-weight: 500;
    }

    .result-description {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-left: auto;
    }

    .mode-indicator {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 122, 255, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../src/index.js" type="module"></script>
</body>
</html>
